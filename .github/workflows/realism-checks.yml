name: Realism quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:lab
      - run: npm run test:lab
      - run: npm run test:motion
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:lab:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-browser-evidence
          path: qa/lab/
